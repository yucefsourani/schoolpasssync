[package]
name = "schoolpasssync"
version = "0.1.1"
edition = "2024"

[dependencies]
calamine = "0.36"
serde = { version = "1.0", features = ["derive"] }
csv = "1.3"
reqwest = { version = "0.11", features = ["json"] }
serde_json = "1.0"
gtk = { version = "0.11.4", package = "gtk4", features = ["gnome_50"] }
glib = { version = "0.20", features = ["v2_68"] }
futures = "0.3"
gio = "0.19"
gdk4 = "0.9"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
keyring = "2.3"
[target.'cfg(target_os = "linux")'.dependencies]
webkit6 = "0.6"
[target.'cfg(target_os = "windows")'.dependencies]
open = "5.3"
[dependencies.adw]
package = "libadwaita"
version = "0.9.1"
features = ["v1_9"]
