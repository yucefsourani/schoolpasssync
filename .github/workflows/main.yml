name: Windows Build & Package

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2 & Install Dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-libsoup3
            mingw-w64-ucrt-x86_64-vulkan-loader

      - name: Build Project with Meson
        run: |
          meson setup build --buildtype=release
          meson compile -C build

      - name: Bundle Executable, DLLs, Licenses, and Icons
        run: |
          mkdir dist
          cp build/src/schoolpasssync.exe dist/
          
          # نسخ الأيقونات
          cp src/com.github.yucefsourani.schoolpasssync.png dist/ || echo "PNG Icon not found"
          cp icon.ico dist/ || echo "ICO Icon not found"

          # استخراج مكتبات DLL الأساسية عبر ldd
          ldd dist/schoolpasssync.exe | grep '\/ucrt64.*\.dll' -o | xargs -I{} cp {} dist/
          
          # جلب ونسخ مكتبة Vulkan الحديثة لضمان توافق نقاط الدخول (Entry Points)
          cp /ucrt64/bin/vulkan-1.dll dist/ || true
          
          # نسخ Schemas و Icons الخاصة بـ GTK
          mkdir -p dist/share/glib-2.0/schemas
          cp /ucrt64/share/glib-2.0/schemas/gschemas.compiled dist/share/glib-2.0/schemas/ || true
          mkdir -p dist/share/icons
          cp -r /ucrt64/share/icons/hicolor dist/share/icons/ || true
          cp -r /ucrt64/share/icons/Adwaita dist/share/icons/ || true
          
          # نسخ رخص مكتبات C الأصلية
          mkdir -p dist/share/licenses
          cp -r /ucrt64/share/licenses/* dist/share/licenses/ || true
          
          # توليد رخص مكتبات Rust
          cargo install cargo-license
          cargo license --authors > dist/THIRD-PARTY-LICENSES.txt
          
          # نسخ رخصة البرنامج
          if [ -f "LICENSE" ]; then cp LICENSE dist/; else echo "GPL-3.0 License" > dist/LICENSE; fi

      - name: Generate Inno Setup Script (.iss)
        run: |
          cat << 'EOF' > installer.iss
          [Setup]
          AppName=SchoolPassSync
          AppVersion=0.1.2
          DefaultDirName={autopf}\SchoolPassSync
          OutputDir=out
          OutputBaseFilename=SchoolPassSync-Windows-Setup
          Compression=lzma2/ultra64
          SolidCompression=yes
          DisableDirPage=no
          DisableProgramGroupPage=yes
          LicenseFile=dist\LICENSE
          SetupIconFile=dist\icon.ico

          [Files]
          Source: "dist\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\SchoolPassSync"; Filename: "{app}\schoolpasssync.exe"; IconFilename: "{app}\icon.ico"
          Name: "{autodesktop}\SchoolPassSync"; Filename: "{app}\schoolpasssync.exe"; Tasks: desktopicon; IconFilename: "{app}\icon.ico"

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop icon"; GroupDescription: "Additional icons:"
          EOF

      - name: Compile Installer with Inno Setup
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer.iss

      - name: Upload Final Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolPassSync-Setup
          path: out/SchoolPassSync-Windows-Setup.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/SchoolPassSync-Windows-Setup.exe
          generate_release_notes: true
