name: Windows Build & Package

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # تفعيل إنشاء الإصدار عند دفع وسم يبدأ بحرف v
  workflow_dispatch:

# إعطاء GitHub Actions الصلاحية لإنشاء الإصدارات ورفع الملفات
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2 & Install Dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita

      - name: Build Project with Meson
        run: |
          meson setup build --buildtype=release
          meson compile -C build

      - name: Bundle Executable, DLLs, Licenses, and Icons
        run: |
          mkdir dist
          cp build/src/schoolpasssync.exe dist/
          
          # نسخ أيقونة PNG الخاصة بواجهة البرنامج
          cp src/com.github.yucefsourani.schoolpasssync.png dist/ || cp com.github.yucefsourani.schoolpasssync.png dist/ || echo "PNG Icon not found"

          # نسخ أيقونة ICO الخاصة بنظام ويندوز (سطح المكتب والمثبت)
          cp src/icon.ico dist/ || cp icon.ico dist/ || echo "ICO Icon not found"

          # استخراج مكتبات DLL
          ldd dist/schoolpasssync.exe | grep '\/mingw.*\.dll' -o | xargs -I{} cp {} dist/
          
          # نسخ Schemas و Icons الأساسية لـ GTK
          mkdir -p dist/share/glib-2.0/schemas
          cp /mingw64/share/glib-2.0/schemas/gschemas.compiled dist/share/glib-2.0/schemas/ || true
          mkdir -p dist/share/icons
          cp -r /mingw64/share/icons/hicolor dist/share/icons/ || true
          cp -r /mingw64/share/icons/Adwaita dist/share/icons/ || true
          
          # نسخ رخص مكتبات C الأصلية (LGPL) من بيئة MSYS2
          mkdir -p dist/share/licenses
          cp -r /mingw64/share/licenses/* dist/share/licenses/ || true
          
          # توليد ملف رخص مكتبات Rust الخارجية تلقائياً
          cargo install cargo-license
          cargo license --authors > dist/THIRD-PARTY-LICENSES.txt
          
          # التأكد من وجود ملف رخصة البرنامج
          if [ -f "LICENSE" ]; then cp LICENSE dist/; else echo "GPL-3.0 License" > dist/LICENSE; fi

      - name: Generate Inno Setup Script (.iss)
        run: |
          cat << 'EOF' > installer.iss
          [Setup]
          AppName=SchoolPassSync
          AppVersion=0.1.0
          DefaultDirName={autopf}\SchoolPassSync
          OutputDir=out
          OutputBaseFilename=SchoolPassSync-Windows-Setup
          Compression=lzma2/ultra64
          SolidCompression=yes
          DisableDirPage=no
          DisableProgramGroupPage=yes
          LicenseFile=dist\LICENSE
          SetupIconFile=dist\icon.ico

          [Files]
          Source: "dist\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\SchoolPassSync"; Filename: "{app}\schoolpasssync.exe"; IconFilename: "{app}\icon.ico"
          Name: "{autodesktop}\SchoolPassSync"; Filename: "{app}\schoolpasssync.exe"; Tasks: desktopicon; IconFilename: "{app}\icon.ico"

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop icon"; GroupDescription: "Additional icons:"
          EOF

      - name: Compile Installer with Inno Setup
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer.iss

      - name: Upload Final Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolPassSync-Setup
          path: out/SchoolPassSync-Windows-Setup.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        # هذه الخطوة ستعمل فقط إذا كان الدفع عبارة عن Tag يبدأ بحرف v
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/SchoolPassSync-Windows-Setup.exe
          generate_release_notes: true
